<main>
  <h1>Snake</h1>
  <p class="mode-badge">Modo {{ modeName() }}</p>

  <div class="top">
    <!-- [input]="..." pasa valores del padre a los inputs del hijo -->
    <app-scoreboard
      [score]="game.score()"
      [highScore]="game.highScore()"
      [level]="game.level()"
    />
    <!-- [disabled] enlaza una propiedad HTML normal a una expresión -->
    <button
      type="button"
      class="pause"
      aria-label="Pausa"
      [disabled]="game.status() !== 'playing'"
      (click)="game.pause()"
    >
      ❚❚
    </button>
  </div>

  <!-- [class.shake]: añade la clase "shake" solo mientras la condición sea true.
       appSwipe: directiva que detecta deslizamientos del dedo sobre el tablero. -->
  <div
    class="stage"
    [class.shake]="game.status() === 'over'"
    appSwipe
    (swipe)="game.changeDirection($event)"
  >
    <app-board />

    <!-- @if: la pantalla solo existe mientras NO se está jugando.
         La tabla de récords, si está abierta, ocupa su lugar. -->
    @if (showLeaderboard()) {
      <app-leaderboard
        animate.enter="screen-enter"
        animate.leave="screen-leave"
        [entries]="leaderboard.entries()"
        [status]="leaderboard.status()"
        [mode]="game.mode()"
        (close)="showLeaderboard.set(false)"
        (retry)="leaderboard.load(game.mode())"
        (modeChange)="game.setMode($event)"
      />
    } @else if (game.status() !== 'playing') {
      <!-- (output)="..." escucha los avisos del hijo.
           animate.enter / animate.leave: Angular pone esas clases CSS
           cuando el elemento aparece y cuando va a desaparecer. -->
      <app-game-screen
        animate.enter="screen-enter"
        animate.leave="screen-leave"
        [status]="game.status()"
        [score]="game.score()"
        [mode]="game.mode()"
        [isNewRecord]="game.isNewRecord()"
        [scoreForm]="scoreForm()"
        [playerName]="leaderboard.playerName()"
        (start)="startGame()"
        (resume)="game.resume()"
        (modeChange)="game.setMode($event)"
        (showLeaderboard)="showLeaderboard.set(true)"
        (submitScore)="submitScore($event)"
      />
    }
  </div>

  <!-- $event es el valor que emitió el hijo (la dirección tocada) -->
  <app-touch-controls (direction)="game.changeDirection($event)" />

  <p class="hint">Flechas / WASD para moverte · P o Espacio para pausar</p>
</main>
