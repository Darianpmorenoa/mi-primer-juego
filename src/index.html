<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Snake</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Color de la barra del navegador en el celular -->
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="El clásico juego de la serpiente, hecho con Angular. Juega gratis en el navegador o en el celular.">

  <!-- Open Graph: lo que muestran WhatsApp, Facebook, LinkedIn, Discord...
       al compartir el enlace. Las URLs deben ser absolutas. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Snake">
  <meta property="og:url" content="https://darianpmorenoa.github.io/mi-primer-juego/">
  <meta property="og:title" content="Snake: el clásico juego de la serpiente">
  <meta property="og:description" content="Come, crece y bate tu récord. Hecho con Angular. Juega gratis en el navegador o en el celular.">
  <meta property="og:image" content="https://darianpmorenoa.github.io/mi-primer-juego/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Título SNAKE en letras retro verdes junto a un tablero con una serpiente y una comida roja">

  <!-- Equivalente para X (Twitter): tarjeta con imagen grande -->
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Fuente retro de Google Fonts para el título y los números -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- PWA: el "manifest" describe el juego como app instalable (nombre,
       iconos, colores). El iPhone prefiere su propia etiqueta para el icono. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Para jugar necesitas activar JavaScript.</noscript>
</body>
</html>
